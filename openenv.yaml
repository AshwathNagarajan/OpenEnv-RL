name: email_triage_openenv
benchmark: email_triage_openenv
description: Multi-step email triage environment for agent evaluation.
entrypoint: app.server:app

tasks:
  - name: easy
    description: Classify and prioritize a single email.
  - name: medium
    description: Classify, prioritize, route, and choose disposition.
  - name: hard
    description: Full email triage with escalation and response drafting.

observation_model: app.models.EmailTriageObservation
action_model: app.models.EmailTriageAction
reward_model: app.models.EmailTriageReward

endpoints:
  reset: /reset
  state: /state
  step: /step

metadata:
  domain: customer_support
  real_world: true
  containerized: true
